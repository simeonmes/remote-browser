name: Deploy static frontend
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
      VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require explicit deployment configuration
        shell: bash
        run: |
          test -n "$VITE_BASE_PATH" || { echo 'Set the VITE_BASE_PATH repository variable.'; exit 1; }
          test -n "$VITE_BACKEND_URL" || { echo 'Set the VITE_BACKEND_URL repository variable.'; exit 1; }
      - run: npm ci
      - run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
